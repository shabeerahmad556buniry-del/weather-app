<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background: linear-gradient(to right, #00c6ff, #0072ff);
      padding:20px;
    }

    .weather-app{
      width:100%;
      max-width:420px;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      border-radius:20px;
      padding:25px;
      box-shadow: 0 0 25px rgba(0,0,0,0.4);
      color:white;
      text-align:center;
    }

    h1{
      font-size:28px;
      margin-bottom:20px;
    }

    .search-box{
      display:flex;
      gap:10px;
      margin-bottom:20px;
    }

    input{
      flex:1;
      padding:12px;
      border:none;
      outline:none;
      border-radius:12px;
      font-size:16px;
    }

    button{
      padding:12px 15px;
      border:none;
      border-radius:12px;
      background:#00ff99;
      cursor:pointer;
      font-weight:bold;
      transition:0.2s;
    }

    button:hover{
      transform:scale(1.05);
    }

    .result{
      margin-top:15px;
      display:none;
    }

    .temp{
      font-size:50px;
      font-weight:bold;
    }

    .city{
      font-size:24px;
      margin-top:10px;
      font-weight:bold;
    }

    .desc{
      font-size:18px;
      margin-top:5px;
      opacity:0.9;
      text-transform:capitalize;
    }

    .details{
      display:flex;
      justify-content:space-between;
      margin-top:20px;
      gap:10px;
    }

    .box{
      flex:1;
      padding:15px;
      border-radius:15px;
      background: rgba(0,0,0,0.25);
      font-size:16px;
    }

    .box span{
      display:block;
      font-size:20px;
      font-weight:bold;
      margin-top:5px;
    }

    .error{
      display:none;
      margin-top:10px;
      color:yellow;
      font-weight:bold;
    }

    img{
      width:100px;
      margin-top:10px;
    }
  </style>
</head>

<body>

  <div class="weather-app">
    <h1>🌦 Weather App</h1>

    <div class="search-box">
      <input type="text" id="cityInput" placeholder="Enter City Name">
      <button onclick="getWeather()">Search</button>
    </div>

    <p class="error" id="errorMsg">❌ City Not Found!</p>

    <div class="result" id="weatherResult">
      <img id="icon" src="">
      <div class="temp" id="temp">--°C</div>
      <div class="city" id="city">City</div>
      <div class="desc" id="desc">Weather</div>

      <div class="details">
        <div class="box">
          Humidity
          <span id="humidity">--%</span>
        </div>
        <div class="box">
          Wind
          <span id="wind">-- km/h</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    let apiKey = "560dc8bfa2794a7872a2c953177e7dd9";

    function getWeather(){
      let city = document.getElementById("cityInput").value;
      let errorMsg = document.getElementById("errorMsg");
      let weatherResult = document.getElementById("weatherResult");

      if(city === ""){
        alert("Please enter a city name!");
        return;
      }

      fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`)
      .then(res => res.json())
      .then(data => {

        if(data.cod == 404){
          errorMsg.style.display = "block";
          weatherResult.style.display = "none";
          return;
        }

        errorMsg.style.display = "none";
        weatherResult.style.display = "block";

        document.getElementById("temp").innerHTML = Math.round(data.main.temp) + "°C";
        document.getElementById("city").innerHTML = data.name;
        document.getElementById("desc").innerHTML = data.weather[0].description;
        document.getElementById("humidity").innerHTML = data.main.humidity + "%";
        document.getElementById("wind").innerHTML = data.wind.speed + " km/h";

        let iconCode = data.weather[0].icon;
        document.getElementById("icon").src = `https://openweathermap.org/img/wn/${iconCode}@2x.png`;

        // background change
        let weatherMain = data.weather[0].main.toLowerCase();

        if(weatherMain.includes("cloud")){
          document.body.style.background = "linear-gradient(to right,#bdc3c7,#2c3e50)";
        }
        else if(weatherMain.includes("rain")){
          document.body.style.background = "linear-gradient(to right,#4b79a1,#283e51)";
        }
        else if(weatherMain.includes("clear")){
          document.body.style.background = "linear-gradient(to right,#f7971e,#ffd200)";
        }
        else if(weatherMain.includes("snow")){
          document.body.style.background = "linear-gradient(to right,#83a4d4,#b6fbff)";
        }
        else{
          document.body.style.background = "linear-gradient(to right,#00c6ff,#0072ff)";
        }

      })
      .catch(err => {
        alert("Error fetching weather data!");
        console.log(err);
      });
    }
  </script>

</body>
</html>
